<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản | Smart Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lexend:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(11, 28, 44, 0.85), rgba(11, 28, 44, 0.85)), 
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070') no-repeat center center fixed;
            background-size: cover; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #fff; padding: 20px 0;
        }

        .auth-container { width: 100%; max-width: 650px; padding: 20px; }

        .glass-card {
            background: rgba(20, 35, 55, 0.6);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            padding: 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header i {
            font-size: 36px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; margin-bottom: 10px;
        }
        .header h2 { font-family: 'Lexend', sans-serif; font-size: 26px; letter-spacing: 1px; }
        .header p { color: #94a3b8; font-size: 14px; margin-top: 5px; }

        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        .input-group { margin-bottom: 18px; position: relative; }
        .input-group label {
            display: block; font-size: 12px; color: #94a3b8;
            margin-bottom: 8px; text-transform: uppercase;
            letter-spacing: 0.5px; font-weight: 500;
        }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: #64748b; transition: 0.3s ease; z-index: 2;
        }

        /* Gộp chung CSS cho thẻ input và select để giao diện đồng nhất */
        .input-wrapper input, .input-wrapper select {
            width: 100%; padding: 12px 14px 12px 45px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: #fff; font-size: 14px; transition: all 0.3s ease; outline: none;
        }

        .input-wrapper input::placeholder { color: #475569; }
        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: #3b82f6; background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        .input-wrapper input:focus + i, .input-wrapper select:focus + i,
        .input-wrapper:focus-within i { color: #3b82f6; }

        /* CSS chỉnh cái icon mũi tên xổ xuống cho thẻ Select */
        .custom-dropdown-fix {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg fill='rgba(255,255,255,0.5)' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 15px center;
            background-size: 20px; cursor: pointer; padding-right: 40px !important;
        }
        .custom-dropdown-fix option { color: #000; background: #fff; }

        /* Bổ sung CSS cho khung báo lỗi */
        #reg-err {
            color: #ef4444; font-size: 14px; margin-bottom: 15px; display: none;
            text-align: center; padding: 12px; background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px;
        }
        #reg-err.show { display: block; animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .btn-submit {
            width: 100%; padding: 14px; margin-top: 15px;
            background: linear-gradient(135deg, #ff6b35, #ea580c);
            border: none; border-radius: 12px; color: white;
            font-size: 16px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(59, 130, 246, 0.5); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .footer-links { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .footer-links a { color: #3b82f6; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .footer-links a:hover { color: #60a5fa; text-decoration: underline; }

        @media (max-width: 600px) { .row { flex-direction: column; gap: 0; } .glass-card { padding: 30px 20px; } }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="glass-card">
            
            <div class="header">
                <i class="fas fa-building"></i>
                <h2>Đăng ký Tài khoản</h2>
                <p>Điền thông tin để bắt đầu quản lý năng lượng</p>
            </div>

           <form onsubmit="return false;">
                
                <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label>Họ và Tên</label>
                            <div class="input-wrapper">
                                <input type="text" id="reg_fullname" placeholder="VD: Thiên Hoàng" required>
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label>Tên đăng nhập</label>
                            <div class="input-wrapper">
                                <input type="text" id="reg_username" placeholder="VD: hoang123" required>
                                <i class="fas fa-id-badge"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label>SĐT hoặc Email</label>
                            <div class="input-wrapper">
                                <input type="text" id="reg_contact" placeholder="SĐT hoặc Email" required>
                                <i class="fas fa-phone-alt"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label>Mã Công Tơ</label>
                            <div class="input-wrapper">
                                <input type="text" id="reg_meter" placeholder="VD: CT-L1-002" required>
                                <i class="fas fa-tachometer-alt"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label>Mã Tòa Phòng</label>
                            <div class="input-wrapper">
                                <input type="text" id="reg_room" placeholder="VD: CB-L1-2" required>
                                <i class="fas fa-door-open"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label>Tỉnh / Thành phố</label>
                            <div class="input-wrapper">
                                <select id="province" class="custom-dropdown-fix" required>
                                    <option value="">-- Chọn Tỉnh/Thành phố --</option>
                                </select>
                                <i class="fas fa-map"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label>Quận / Huyện</label>
                            <div class="input-wrapper">
                                <select id="district" class="custom-dropdown-fix" required disabled>
                                    <option value="">-- Chọn Quận/Huyện --</option>
                                </select>
                                <i class="fas fa-map-pin"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label>Phường / Xã</label>
                            <div class="input-wrapper">
                                <select id="ward" class="custom-dropdown-fix" required disabled>
                                    <option value="">-- Chọn Phường/Xã --</option>
                                </select>
                                <i class="fas fa-home"></i>
                            </div>
                        </div>
                    </div>
                </div>

              <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label>Mật khẩu</label>
                            <div class="input-wrapper">
                                <input type="password" id="reg_password" placeholder="••••••••" style="padding-right: 40px;" required>
                                <i class="fas fa-lock"></i>
                                <i class="fas fa-eye" onclick="togglePassword('reg_password', this)" style="position: absolute; right: 15px; left: auto; z-index: 10; cursor: pointer; color: #94a3b8; pointer-events: auto;"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label>Xác nhận Mật khẩu</label>
                            <div class="input-wrapper">
                                <input type="password" id="reg_confirm_password" placeholder="••••••••" style="padding-right: 40px;" required>
                                <i class="fas fa-lock"></i>
                                <i class="fas fa-eye" onclick="togglePassword('reg_confirm_password', this)" style="position: absolute; right: 15px; left: auto; z-index: 10; cursor: pointer; color: #94a3b8; pointer-events: auto;"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="reg-err"></div>

                <button type="button" class="btn-submit" id="btnSubmit">
                    <i class="fas fa-user-plus"></i> Đăng Ký Ngay
                </button>
            </form>

            <div class="footer-links">
                Bạn đã có tài khoản? <a href="/login">Đăng nhập</a>
            </div>

        </div>
    </div>

    <script>
        // BÊ NGUYÊN SI BẢN ĐỒ VIỆT NAM OFFLINE TỪ BÊN KIA QUA
        const VIETNAM_DATA = [
          {code:"01",name:"Hà Nội",districts:[
            {code:"001",name:"Quận Ba Đình",wards:[{code:"00001",name:"Phường Phúc Xá"},{code:"00004",name:"Phường Trúc Bạch"}]},
            {code:"002",name:"Quận Hoàn Kiếm",wards:[{code:"00037",name:"Phường Phúc Tân"}]},
            {code:"005",name:"Quận Cầu Giấy",wards:[{code:"00157",name:"Phường Nghĩa Đô"},{code:"00163",name:"Phường Mai Dịch"}]}
          ]},
          {code:"48",name:"Đà Nẵng",districts:[
            {code:"490",name:"Quận Liên Chiểu",wards:[{code:"20194",name:"Phường Hòa Hiệp Bắc"},{code:"20200",name:"Phường Hòa Minh"}]},
            {code:"491",name:"Quận Thanh Khê",wards:[{code:"20203",name:"Phường Tam Thuận"},{code:"20209",name:"Phường Xuân Hà"}]},
            {code:"492",name:"Quận Hải Châu",wards:[{code:"20227",name:"Phường Thanh Bình"},{code:"20230",name:"Phường Thuận Phước"},{code:"20245",name:"Phường Hòa Thuận Tây"},{code:"20246",name:"Phường Hòa Thuận Đông"}]},
            {code:"493",name:"Quận Sơn Trà",wards:[{code:"20260",name:"Phường Thọ Quang"},{code:"20272",name:"Phường Phước Mỹ"}]},
            {code:"494",name:"Quận Ngũ Hành Sơn",wards:[{code:"20281",name:"Phường Mỹ An"},{code:"20284",name:"Phường Khuê Mỹ"}]},
            {code:"495",name:"Quận Cẩm Lệ",wards:[{code:"20293",name:"Phường Khuê Trung"}]}
          ]},
          {code:"79",name:"Hồ Chí Minh",districts:[
            {code:"760",name:"Quận 1",wards:[{code:"26734",name:"Phường Tân Định"},{code:"26740",name:"Phường Bến Nghé"}]},
            {code:"761",name:"Quận 3",wards:[{code:"26764",name:"Phường 14"}]}
          ]}
        ]; // Tui đã rút gọn mảng này ở đây cho sếp dễ nhìn, bản chất nó vẫn load API 63 tỉnh thành ở dưới

        let localData = [];

        document.addEventListener("DOMContentLoaded", function() {
            // Gắn sự kiện nút bấm
            document.getElementById('btnSubmit').addEventListener('click', function(e) {
                doRegister(e);
            });

            // Gọi API Tỉnh Thành
            fetch('https://provinces.open-api.vn/api/?depth=3')
                .then(res => res.json())
                .then(data => {
                    localData = data;
                    const provinceSelect = document.getElementById('province');
                    data.forEach(p => {
                        provinceSelect.innerHTML += `<option value="${p.code}">${p.name}</option>`;
                    });
                })
                .catch(err => {
                    console.error("Dùng data offline do API lỗi");
                    localData = VIETNAM_DATA;
                    const provinceSelect = document.getElementById('province');
                    localData.forEach(p => {
                        provinceSelect.innerHTML += `<option value="${p.code}">${p.name}</option>`;
                    });
                });
        });

        // Xử lý thay đổi Tỉnh -> Huyện
        document.getElementById('province').addEventListener('change', function() {
            const dSelect = document.getElementById('district');
            const wSelect = document.getElementById('ward');
            dSelect.innerHTML = '<option value="">-- Chọn Quận/Huyện --</option>';
            wSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
            wSelect.disabled = true;

            if(!this.value) { dSelect.disabled = true; return; }

            const province = localData.find(p => p.code == this.value);
            province.districts.forEach(d => {
                dSelect.innerHTML += `<option value="${d.code}">${d.name}</option>`;
            });
            dSelect.disabled = false;
        });

        // Xử lý thay đổi Huyện -> Xã
        document.getElementById('district').addEventListener('change', function() {
            const wSelect = document.getElementById('ward');
            wSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';

            if(!this.value) { wSelect.disabled = true; return; }

            const province = localData.find(p => p.code == document.getElementById('province').value);
            const district = province.districts.find(d => d.code == this.value);

            district.wards.forEach(w => {
                wSelect.innerHTML += `<option value="${w.code}">${w.name}</option>`;
            });
            wSelect.disabled = false;
        });

        // XỬ LÝ SUBMIT VÀ NHẢY TRANG
        function doRegister(event) {
            if (event) event.preventDefault();

            const errDiv = document.getElementById('reg-err');
            const btn = document.getElementById('btnSubmit');

            errDiv.classList.remove('show');
            errDiv.textContent = '';

            const fullname    = document.getElementById('reg_fullname').value.trim();
            const username    = document.getElementById('reg_username').value.trim();
            const contact     = document.getElementById('reg_contact').value.trim();
            const meter_id    = document.getElementById('reg_meter').value.trim();
            const room_code   = document.getElementById('reg_room').value.trim();
            const password    = document.getElementById('reg_password').value;
            const confirmPassword = document.getElementById('reg_confirm_password').value;

            const pSelect = document.getElementById('province');
            const dSelect = document.getElementById('district');
            const wSelect = document.getElementById('ward');

            if (!fullname || !username || !contact || !meter_id || !room_code || !password) {
                showError('Vui lòng điền đầy đủ thông tin (Kể cả Tên đăng nhập)!');
                return;
            }
            if (!pSelect.value || !dSelect.value || !wSelect.value) {
                showError('Vui lòng chọn đầy đủ Tỉnh, Quận/Huyện, Phường/Xã!');
                return;
            }
            if (password !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp!');
                return;
            }
            if (password.length < 6) {
                showError('Mật khẩu phải có ít nhất 6 ký tự!');
                return;
            }

            const pText = pSelect.options[pSelect.selectedIndex].text;
            const dText = dSelect.options[dSelect.selectedIndex].text;
            const wText = wSelect.options[wSelect.selectedIndex].text;
            const address = `${wText}, ${dText}, ${pText}`;

            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    fullname: fullname,
                    username: username,
                    contact: contact,
                    meter_code: meter_id,
                    room_code: room_code,
                    address: address,
                    password: password
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showError('✓ Đăng ký thành công! Đang nạp hệ thống...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard'; 
                    }, 1200);
                } else {
                    showError(data.error || data.message || 'Đăng ký thất bại!');
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }
            })
            .catch(err => {
                showError('✗ Mất kết nối với Server!');
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            });
        }

        // HÀM HIỆN THÔNG BÁO LỖI
        function showError(message, type = 'error') {
            const errDiv = document.getElementById('reg-err');
            errDiv.textContent = message;
            errDiv.classList.add('show');

            if (type === 'success') {
                errDiv.style.color = '#10b981';
                errDiv.style.background = 'rgba(16, 185, 129, 0.15)';
                errDiv.style.borderColor = 'rgba(16, 185, 129, 0.3)';
            } else {
                errDiv.style.color = '#ef4444';
                errDiv.style.background = 'rgba(239, 68, 68, 0.15)';
                errDiv.style.borderColor = 'rgba(239, 68, 68, 0.3)';
            }
        }

        // HÀM BẬT/TẮT CON MẮT MẬT KHẨU
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text'; // Hiện mật khẩu
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash'); // Đổi icon thành gạch chéo
            } else {
                input.type = 'password'; // Ẩn mật khẩu
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye'); // Trở lại icon mắt bình thường
            }
        }
    </script>
</body>
</html>
