<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Building AI - Enterprise Solutions</title>
    <style>
       /* 1. Sửa lại Body: Để nền trắng làm gốc cho bên trái sạch sẽ */
body { 
    margin: 0; 
    font-family: 'Segoe UI', sans-serif; 
    background: #ffffff; /* Đổi thành trắng */
    color: white; 
}

/* 2. Sửa lại Nav: Cho nó cùng màu với nền tối bên phải hoặc trong suốt */
nav { 
    display: flex; 
    justify-content: space-between; 
    padding: 25px 80px; 
    align-items: center; 
    background: #0f172a; /* Ép màu tối đồng nhất với bên phải */
    border-bottom: 1px solid rgba(255,255,255,0.1); 
}

/* 3. Sửa lại Hero: Chia đôi 50/50 sắc lẹm */
.hero { 
    height: 85vh; 
    display: flex; 
    align-items: center; 
    padding: 0 80px; 
    /* Trắng bên trái (#ffffff), Navy bên phải (#0f172a) */
    background: linear-gradient(to right, 
        #ffffff 50%, 
        #0f172a 50%
    ); 
}

/* 4. Đảm bảo chữ bên trái màu đen để nổi trên nền trắng */
.hero-content h1 { 
    color: #0f172a; /* Màu chữ tối cho bên trắng */
    font-size: 60px; 
    margin-bottom: 20px; 
    line-height: 1.2; 
}
.hero-content p { 
    color: #475569; /* Màu xám đậm cho dễ đọc */
    font-size: 18px; 
    margin-bottom: 40px; 
}
        .btn-main { background: #10b981; color: white; padding: 18px 45px; border-radius: 12px; text-decoration: none; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">BUILDING AI</div>
        <div class="auth-btns">
            <a href="/setup" class="btn-login">Đăng nhập</a>
            <a href="/setup" class="btn-signup">Đăng ký</a>
        </div>
    </nav>
    <div class="hero">
        <div class="hero-content">
            <h1>Quản lý Tòa nhà <br><span style="color: #3b82f6">Kỷ nguyên AI V2.1</span></h1>
            <p>Hệ thống tích hợp Gemini AI giúp tối ưu hóa 30% điện năng vận hành, tự động hóa kịch bản và dự báo phụ tải thời gian thực.</p>
            <a href="/setup" class="btn-main">Bắt đầu trải nghiệm</a>
        </div>
    </div>
</body>
</html>
